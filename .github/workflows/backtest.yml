name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Which run?'
        required: true
        default: 'selftest'
        type: choice
        options:
          - selftest
          - short
          - full

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install numpy pandas requests

      - name: Selftest
        if: inputs.command == 'selftest'
        run: python backtest_v3.py --selftest

      - name: Short run
        if: inputs.command == 'short'
        run: python backtest_v3.py --days 90 --symbols BTC ETH --no-cache

      - name: Full run
        if: inputs.command == 'full'
        run: python backtest_v3.py --days 1460 --no-cache

      - name: Commit results
        if: inputs.command != 'selftest'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "backtest run [skip ci]"
          git pull --rebase origin main || true
          git push || true

      - name: Upload artifacts
        if: inputs.command != 'selftest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_report.json
            backtest_trades.csv
          retention-days: 30
