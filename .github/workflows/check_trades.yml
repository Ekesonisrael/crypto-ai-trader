name: Check Trades & Update Stats

on:
  schedule:
    # Runs once a day at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  update_stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Trade Resolver
        run: python check_trades.py

      - name: Commit and Push Stats Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update trade stats [skip ci]"
          git push
