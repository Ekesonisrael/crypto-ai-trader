name: Check Trades & Update Stats

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: crypto-bot-workflows
  cancel-in-progress: false

jobs:
  update_stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trade resolver
        run: python check_trades.py

      - name: Commit stats update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "stats: update [skip ci]"
          git pull --rebase origin main
          git push
